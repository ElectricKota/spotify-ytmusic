[project]
name = "sp2yt"
version = "0.1.0"
description = "Přesun oblíbených skladeb ze Spotify do YouTube Music bez duplicit"
requires-python = ">=3.12"
dependencies = [
    "spotipy>=2.24",
    "ytmusicapi>=1.10",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
]

[project.scripts]
sp2yt = "sp2yt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sp2yt"]
